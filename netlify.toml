[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # Public configuration values also occur in documentation and source code.
  # Keep credential values and all source paths covered by secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PAYMENT_ENVIRONMENT,PORT,HOST,AGREEMENT_VERSION,PAYMENT_DESCRIPTION,MERCHANT_NAME,EMAIL_FROM,ESSENTIAL_PRICE_INR,SMTP_HOST,PUBLIC_ORIGIN"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit"]
  included_files = ["node_modules/pdfkit/js/data/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
