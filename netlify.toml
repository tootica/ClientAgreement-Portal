[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # Public application settings also appear in source, examples, and static assets.
  # Keep credential scanning enabled; exclude only these non-sensitive values.
  SECRETS_SCAN_OMIT_KEYS = "AGREEMENT_VERSION,EMAIL_ALLOW_TEST,EMAIL_ENABLED,EMAIL_FROM,ESSENTIAL_PRICE_INR,MERCHANT_NAME,PAYMENT_DESCRIPTION,PAYMENTS_ENABLED,PUBLIC_ORIGIN,SMTP_HOST,SMTP_PORT,SMTP_SECURE"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit"]
  included_files = ["node_modules/pdfkit/js/data/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
